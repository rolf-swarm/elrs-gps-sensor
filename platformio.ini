[platformio]
default_envs = teensy41

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	mikalhart/TinyGPSPlus @ ^1.0.3
	olikraus/U8g2 @ ^2.36.12

[env:teensy41]
platform = teensy
board = teensy41

[env:tinypico]
platform = espressif32
board = tinypico
build_flags =
	-DCRSF_RX_PIN=32
	-DCRSF_TX_PIN=33
	-DGPS_RX_PIN=25
	-DGPS_TX_PIN=26
	-DOLED_SDA_PIN=21
	-DOLED_SCL_PIN=22
